# =======================================================================
# SCovox — RGB-D, completeness-favouring operating point
# =======================================================================
# One of three recorded points on a SINGLE axis. `batch_hits` and `w_occ`
# are not independent knobs: batching decides whether a unit of evidence
# is an observation or a depth pixel, and `w_occ` scales that unit. Move
# one without the other and the voxel reaches the fixed
# `dirichlet_min_p_occ` gate at a different rate, which is what actually
# changes the map. The three files are:
#
#   scovox_best_method.yaml   batch_hits true,  w_occ 1.5  <- promoted
#   scovox_rgbd_complete.yaml batch_hits true,  w_occ 6.0  <- this file
#   scovox_rgbd_unbatched.yaml batch_hits false, w_occ 1.5
#
# This file is the promoted configuration with `w_occ` raised to the
# weight that compensates for batching's change of unit. It writes more
# voxels per frame than the promoted point and correspondingly fewer of
# them are confident. Which point to run is an application decision --
# a planner that must not drive through unmapped floor and a labelling
# pass that must not paint phantoms do not want the same one. Nothing
# here is a defect in the others.
#
# WHY 6.0 AND NOT SOME NEARBY VALUE. `SemSplitParams::w_occ` is passed
# through `beta_lattice_snap` (`sem_split_map.cpp`), because the Beta
# channel stores counts as uint16 units of 1/8 and only whole eighths
# accumulate exactly. 6.0 is a whole eighth, so the snap is a no-op and
# the uint16 and float builds stay byte-identical. A value like 6.1 is
# silently moved and the run then measures a weight nobody chose.
#
# NOT THE LiDAR 8.0. `lidar_mapping.yaml` also carries a large `w_occ`,
# but it is derived from a sensor model (prob_hit ~ 0.9) at resolution
# 0.10. The value here is a units compensation for a deposit rule, not a
# sensor property, and the two must not be reconciled or shared.
#
# Load via:
#   ros2 run scovox_mapping scovox_mapping_node \
#       --ros-args --params-file <path>/scovox_rgbd_complete.yaml
#
# VERIFYING IT TOOK. The node logs the sanitised parameter set read back
# out of the constructed map, never the launch argument. A binary
# predating a knob accepts the parameter and ignores it. Grep the log
# for the deposit-rule line and the "promoted config" line, not for the
# argument you passed.
# =======================================================================

/**:
  ros__parameters:

    # ---- Lattice -------------------------------------------------------
    resolution: 0.05

    # ---- Occupancy (Stream A) ------------------------------------------
    # THE ONE LINE THAT DIFFERS FROM scovox_best_method.yaml.
    w_occ:  6.0
    w_free: 1.0

    # ---- Semantics (Stream B) ------------------------------------------
    kappa0: 1.0
    num_classes: 14
    max_semantic_classes: 14
    semantic_mode: "dirichlet"
    dirichlet_min_p_occ: 0.5
    evidence_saturation: 0
    semantic_evict_by_confidence: true
    semantic_band_length: 0.10
    semantic_band_require_occ: false
    semantic_spread_radius: 0.0

    # ---- Geometry integration ------------------------------------------
    enable_tsdf: false
    fused_walker: true
    stride: 2
    min_depth: 0.4
    max_depth: 4.0
    min_range: 0.4
    max_range: 4.0
    trace_no_return_rays: true

    # One deposit per voxel per frame -- the frame's strongest ray. True
    # here, as in the promoted config; `w_occ` above is what differs.
    batch_hits: true

    # ---- Knobs deliberately left at their library defaults --------------
    # inc_mode 0, hit_flat_share false, inc_thresh 0.10,
    # class_evidence_saturation -1, ray_spread 0 -- identical to
    # scovox_best_method.yaml, including the caveat that
    # class_evidence_saturation -1 resolves to "uncapped" only because
    # evidence_saturation is 0 above. Raising it caps BOTH channels.
