# =======================================================================
# SCovox — the COUNT MAP deposit rule (overlay)
# =======================================================================
# Load this ON TOP of a base config to make the node deposit whole-number
# looks instead of a soft posterior:
#
#   ros2 run scovox_mapping scovox_mapping_node --ros-args \
#     --params-file /scovox/config/scovox_fused_lidar_rgbd.yaml \
#     --params-file /scovox/config/scovox_count_map.yaml
#
# A voxel's `cnt[k]` then counts the scans that argmaxed to class k, rather
# than accumulating fractions of a probability.
#
# The rule is five knobs and they only mean the count map together:
#   inc_mode=hard            a look's whole class_share goes to its argmax
#   hit_flat_share=true      an ENDPOINT look is worth kappa0, not kappa0*p_occ
#   band_require_occ=false   a BAND look is worth kappa0 too — this is the
#                            band's half of the same rule, and hit_flat_share
#                            does not reach it
#   batch_band=true          one band deposit per voxel per scan, not per pixel
#   evidence_saturation=0    no cap, so a count stays a count
#
# Leaving band_require_occ at its default (true) is not a smaller version of
# the count map: the band then weights by p_occ AND drops every voxel with no
# Beta entry, which under w_free 0 is most of the band.
#
# The occupancy weights below are the other half, and they are per sensor —
# this file carries the LiDAR point. For an RGB-D sensor use w_occ 3.0 with
# the same w_free 0.0, and read the map out at 0.99 rather than 0.5. There is
# no RGB-D-only base config in this package; on the fused base the RGB-D
# stream is semantics-only and takes the LiDAR occupancy point.
#
# READING THE LOG. The node's `semantic deposit:` line prints the GLOBAL band
# parameters, so it reports the band as active whether or not a given stream
# actually walks one — `band_active` is decided per ray from the source
# profile. The `deposit config:` line does confirm inc_mode, batch_band and
# hit_flat_share, which are global.
#
# CARVE-OFF HAS A PLANNING CONSEQUENCE. w_free 0 stops the free-space
# carve, so the map holds occupied evidence and unknown space, not swept
# free space. A planner that reads free space from this map will see far
# less of it. Keep the carve by dropping the w_free line (and, on the fused
# base, the lidar_w_free line) from this overlay; the count map's deposit
# rule is independent of it.
# =======================================================================

/**:
  ros__parameters:
    # --- Deposit rule ------------------------------------------------------
    inc_mode:       "hard"     # soft | hard | thresh
    hit_flat_share: true
    batch_band:     true
    batch_hits:     true       # prerequisite for both: one look per scan
    evidence_saturation: 0     # no cap on (a_occ, a_free, sem_cnt)
    semantic_evict_by_confidence: true

    # --- Occupancy point (LiDAR) -------------------------------------------
    w_occ:        1.5
    w_free:       0.0
    lidar_w_occ:  1.5          # read by the fused base; ignored by the others
    lidar_w_free: 0.0
    semantic_occ_gate: 0.5     # RGB-D reads out at 0.99 instead

    # --- Semantic band ------------------------------------------------------
    semantic_band_length:  0.10
    semantic_band_require_occ: false  # flat kappa0 per look; see header
    semantic_spread_radius: 0.0   # the band and the ball are alternatives

    # --- The band needs the TSDF off ---------------------------------------
    # `sdf_trunc` is the walk's reach behind the surface, and enable_tsdf=true
    # sets it to sdf_trunc_voxels * resolution. Off, TsdfMap re-clamps it to
    # 0.15 m, which is the reach the count map is built around. Leaving the
    # TSDF on lengthens every ray's tail and changes the map.
    enable_tsdf: false

    # --- Fused base only: give the RGB-D stream the band -------------------
    # `band_active` is false for any source with kernel_radius > 0 or
    # geometry_off, so on the fused base the RGB-D stream takes the BKI ball
    # and the band above never runs on it. These two lines substitute the band
    # for the ball. With the TSDF off, geometry_off gates nothing else.
    #
    # The cost is real: an ungated band deposits RGB-D classes without
    # consulting LiDAR occupancy, so pure LiDAR authority holds at the RGB-D
    # ENDPOINT (rgbd_dirichlet_min_p_occ still gates it) but not along its
    # band. Drop these two lines to keep the ball and the authority; the
    # LiDAR stream still runs the count map.
    rgbd_kernel_radius: 0.0
    rgbd_geometry_off:  false
